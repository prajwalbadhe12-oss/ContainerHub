
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: containerhub:1.0.0
    container_name: containerhub-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: containerhub
      DB_USER: containerhub_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: containerhub-frontend:1.0.0
    container_name: containerhub-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    container_name: containerhub-db
    environment:
      POSTGRES_DB: containerhub
      POSTGRES_USER: containerhub_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U containerhub_user -d containerhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
